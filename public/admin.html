<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Avertizări Meteorologice — Administrare</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <!-- Tailwind must load before tailwind.config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { corePlugins: { preflight: false } };</script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <!-- ── Admin list ─────────────────────────────────────────────────────── -->
  <section id="list-view" style="display:block">
    <div class="admin-header">
      <h1>Avertizări Meteorologice</h1>
      <button class="logout-btn" onclick="handleLogout()">Ieșire</button>
    </div>

    <div class="list" id="saved-list">
      <div class="empty">Nu există avertismente deocamdată</div>
    </div>

    <button class="btn btn-create" onclick="showEditor()">Adaugă avertizare</button>
    <button class="clear-btn" onclick="clearAllWarnings()">Șterge totul</button>
  </section>

  <!-- ── Warning editor ────────────────────────────────────────────────── -->
  <section id="editor-view">
    <div id="map"></div>

    <div class="panel">
      <div>
        <button class="btn-back" onclick="showList()">← Înapoi</button>
        <h1>AVERTIZARE</h1>
      </div>

      <div class="field">
        <label>Data emiterii</label>
        <input type="hidden" id="emitDate" required>
        <button type="button" id="emitDate-trigger" class="date-trigger group" onclick="openCalendar('emitDate')">
          <span class="date-trigger-icon-wrap">
            <svg class="date-trigger-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="5" width="18" height="16" rx="2"></rect>
              <path d="M3 9h18M8 3v4M16 3v4"></path>
            </svg>
          </span>
          <span id="emitDate-label" class="date-trigger-label">Alege data și ora</span>
          <svg class="date-trigger-chevron" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/>
          </svg>
        </button>
      </div>

      <div class="field">
        <label>Fenomene</label>
        <select id="phenomenon" required>
          <option value="">Alege fenomenul</option>
        </select>
      </div>

      <div class="field">
        <label>Intervalul de acțiune</label>
        <div class="interval-fields">
          <div>
            <label for="intervalFrom-trigger">De la</label>
            <input type="hidden" id="intervalFrom" required>
            <button type="button" id="intervalFrom-trigger" class="date-trigger group" onclick="openCalendar('intervalFrom')">
              <span class="date-trigger-icon-wrap">
                <svg class="date-trigger-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                  <path d="M3 9h18M8 3v4M16 3v4"></path>
                </svg>
              </span>
              <span id="intervalFrom-label" class="date-trigger-label">Alege data și ora</span>
              <svg class="date-trigger-chevron" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/>
              </svg>
            </button>
          </div>
          <div>
            <label for="intervalTo-trigger">Până la</label>
            <input type="hidden" id="intervalTo" required>
            <button type="button" id="intervalTo-trigger" class="date-trigger group" onclick="openCalendar('intervalTo')">
              <span class="date-trigger-icon-wrap">
                <svg class="date-trigger-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                  <path d="M3 9h18M8 3v4M16 3v4"></path>
                </svg>
              </span>
              <span id="intervalTo-label" class="date-trigger-label">Alege data și ora</span>
              <svg class="date-trigger-chevron" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div>
        <label class="color-label">Culoare pentru umplerea raioanelor</label>
        <div class="colors">
          <div class="color-btn green"  data-color="#28D762" title="Normă — resetează culoarea"></div>
          <div class="color-btn yellow active" data-color="#FFED00"></div>
          <div class="color-btn orange" data-color="#FF8A00"></div>
          <div class="color-btn red"    data-color="#FF0000"></div>
        </div>
        <button type="button" class="btn-paint-all" onclick="paintAllDistricts()">Colorează toată harta</button>
        <div class="paint-hint">Dublu-click pentru a colora un raion. Shift + click pentru mai multe raioane.</div>
      </div>

      <div id="codes-container"></div>
      <button class="btn-add" onclick="addCodeBlock()">Adaugă cod</button>

      <div class="btn-row">
        <button class="btn btn-send" id="send-btn" onclick="sendToServer()" disabled>Trimite pe server</button>
        <button class="btn btn-reset" onclick="resetMapColors()">Resetează</button>
      </div>
    </div>
  </section>

  <!-- ── Warning detail popup ──────────────────────────────────────────── -->
  <div class="overlay" id="overlay" onclick="closeAdminPopup(event)">
    <div class="popup" onclick="event.stopPropagation()">
      <div class="popup-header">
        <h2>⚠️ AVERTIZĂRI METEOROLOGICE</h2>
        <button class="close-btn" onclick="closeAdminPopup()">×</button>
      </div>
      <div class="popup-body">
        <div class="popup-map">
          <img id="popup-img" src="" alt="Harta">
        </div>
        <div class="popup-info">
          <h3>AVERTIZARE</h3>
          <div class="info-row"><span class="label">Data emiterii:</span>      <span class="value" id="p-date"></span></div>
          <div class="info-row"><span class="label">Fenomene:</span>           <span class="value" id="p-phenomenon"></span></div>
          <div class="info-row"><span class="label">Intervalul de acțiune:</span> <span class="value" id="p-interval"></span></div>
          <div id="p-codes"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Calendar popover ──────────────────────────────────────────────── -->
  <div id="calendar-popover"
       class="hidden fixed z-[80] w-[336px] overflow-hidden rounded-2xl border border-slate-200/80 bg-white shadow-[0_20px_50px_-12px_rgba(15,39,73,0.28)] ring-1 ring-slate-900/5">
    <div class="bg-gradient-to-br from-[#1E4B8E] to-[#163A6E] px-4 pb-4 pt-4 text-white">
      <div class="mb-3 flex items-center justify-between">
        <button type="button"
                class="flex h-8 w-8 items-center justify-center rounded-full bg-white/10 text-lg leading-none text-white transition hover:bg-white/20"
                onclick="shiftCalendarMonth(-1)" aria-label="Luna anterioară">‹</button>
        <div class="text-[15px] font-semibold tracking-wide" id="calendar-title"></div>
        <button type="button"
                class="flex h-8 w-8 items-center justify-center rounded-full bg-white/10 text-lg leading-none text-white transition hover:bg-white/20"
                onclick="shiftCalendarMonth(1)" aria-label="Luna următoare">›</button>
      </div>
      <div class="rounded-xl bg-white/10 px-3 py-2 backdrop-blur-sm">
        <div class="text-[10px] font-semibold uppercase tracking-[0.14em] text-blue-100/80">Selectat</div>
        <div id="calendar-selected-label" class="mt-0.5 text-sm font-semibold text-white">—</div>
      </div>
    </div>

    <div class="px-4 pb-4 pt-3">
      <div class="mb-1.5 grid grid-cols-7 gap-1 text-center text-[11px] font-semibold uppercase tracking-wide text-slate-400">
        <span>Lu</span><span>Ma</span><span>Mi</span><span>Jo</span><span>Vi</span><span>Sâ</span><span>Du</span>
      </div>
      <div id="calendar-days" class="grid grid-cols-7 gap-1"></div>

      <div class="mt-4 rounded-xl border border-slate-100 bg-slate-50/80 p-3">
        <div class="mb-2 flex items-center gap-2 text-[11px] font-semibold uppercase tracking-wide text-slate-400">
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 7v5l3 2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          Ora
        </div>
        <div class="flex items-center gap-2">
          <select id="cal-hour"
                  class="h-10 flex-1 rounded-xl border border-slate-200 bg-white px-3 text-sm font-semibold text-slate-800 outline-none transition focus:border-[#1E4B8E] focus:ring-2 focus:ring-[#1E4B8E]/20"></select>
          <span class="text-base font-bold text-slate-300">:</span>
          <select id="cal-minute"
                  class="h-10 flex-1 rounded-xl border border-slate-200 bg-white px-3 text-sm font-semibold text-slate-800 outline-none transition focus:border-[#1E4B8E] focus:ring-2 focus:ring-[#1E4B8E]/20"></select>
        </div>
      </div>

      <div class="mt-3 flex gap-2">
        <button type="button"
                class="flex-1 rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm font-semibold text-slate-600 transition hover:bg-slate-50 hover:text-slate-800"
                onclick="setCalendarToday()">Astăzi</button>
        <button type="button"
                class="flex-1 rounded-xl bg-[#1E4B8E] px-3 py-2.5 text-sm font-semibold text-white shadow-sm shadow-[#1E4B8E]/30 transition hover:bg-[#163A6E]"
                onclick="closeCalendar(true)">Gata</button>
      </div>
    </div>
  </div>

  <!-- ── Scripts (MVC load order: model → view → controller) ──────────── -->
  <script src="/js/district-codes.js"></script>
  <script src="/js/models/warnings.js"></script>
  <script src="/js/models/auth.js"></script>
  <script src="/js/views/calendar-view.js"></script>
  <script src="/js/views/admin-view.js"></script>
  <script src="/js/controllers/admin.js"></script>
</body>
</html>
