<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Editor hărți — widget</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { corePlugins: { preflight: false } };</script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <section id="list-view" style="display:block">
    <div class="admin-header">
      <h1>Hărți pentru widget</h1>
      <div class="studio-header-actions">
        <a class="logout-btn" href="/admin">Avertizări</a>
        <button class="logout-btn" onclick="handleLogout()">Ieșire</button>
      </div>
    </div>

    <div class="list" id="studio-list">
      <div class="empty">Nu există hărți</div>
    </div>

    <button class="btn btn-create" onclick="createAndEdit()">Hartă nouă</button>
  </section>

  <section id="editor-view">
    <div id="map"></div>

    <div class="panel">
      <div>
        <button class="btn-back" onclick="showStudioList()">← Înapoi</button>
        <h1>EDITOR HARTĂ</h1>
        <p class="paint-hint">Salvarea este automată. Widgetul încorporat se actualizează în câteva secunde.</p>
      </div>

      <div class="field">
        <label for="map-title">Titlu</label>
        <input type="text" id="map-title" maxlength="255" placeholder="Titlul hărții">
      </div>

      <div>
        <label class="color-label">Culoare pentru umplerea raioanelor</label>
        <div class="colors">
          <div class="color-btn green"  data-color="#28D762" title="Normă — resetează culoarea"></div>
          <div class="color-btn yellow active" data-color="#FFED00"></div>
          <div class="color-btn orange" data-color="#FF8A00"></div>
          <div class="color-btn red"    data-color="#FF0000"></div>
        </div>
        <button type="button" class="btn-paint-all" onclick="paintAllDistricts()">Colorează toată harta</button>
        <div class="paint-hint">Dublu-click pentru a colora un raion. Shift + click pentru mai multe raioane.</div>
        <div class="info">Raioane colorate: <span id="count">0</span></div>
      </div>

      <div class="field">
        <label>Link widget</label>
        <input type="text" id="embed-url" readonly onclick="this.select()">
      </div>
      <div class="field">
        <label>Cod iframe (pentru alt site)</label>
        <textarea id="embed-code" readonly onclick="this.select()" class="embed-code"></textarea>
        <button type="button" class="btn-paint-all" onclick="copySnippet(currentToken)">Copiază iframe</button>
      </div>

      <div class="btn-row">
        <button class="btn btn-send" type="button" onclick="persistMap()">Salvează acum</button>
        <button class="btn btn-reset" type="button" onclick="resetMapColors()">Resetează</button>
      </div>
      <div id="save-status" class="paint-hint">Modificările se salvează automat</div>
    </div>
  </section>

  <script src="/js/district-codes.js"></script>
  <script src="/js/models/auth.js"></script>
  <script src="/js/models/maps.js"></script>
  <script src="/js/controllers/studio.js"></script>
</body>
</html>
