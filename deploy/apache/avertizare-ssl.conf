# Persistent SNI vhost for the public API hostname.
# Webuzo regenerates webuzoVH.conf (self-signed) at midnight;
# this file in conf.d is not overwritten.
#
# Install:
#   cp deploy/apache/avertizare-ssl.conf /usr/local/apps/apache2/etc/conf.d/avertizare-ssl.conf
#   /usr/local/apps/apache2/bin/httpd -t && kill -USR1 "$(cat /usr/local/apps/apache2/logs/httpd.pid)"
<VirtualHost 31.131.24.146:443>
	ServerName avertizare.31.131.24.146.sslip.io
	ServerAlias 31.131.24.146.sslip.io
	DocumentRoot /opt/avertizare/public
	SSLEngine on
	SSLCertificateFile /etc/zerossl/avertizare.31.131.24.146.sslip.io/fullchain.pem
	SSLCertificateKeyFile /etc/zerossl/avertizare.31.131.24.146.sslip.io/privkey.pem
	SSLUseStapling off
	ErrorLog /usr/local/apps/apache2/logs/avertizare.sslip.io.err
	CustomLog /usr/local/apps/apache2/logs/avertizare.sslip.io.log combined
</VirtualHost>
